site_name: Intelligence Per Watt
site_description: Benchmarking Intelligence Efficiency for LM Inference Systems
site_url: https://hazyresearch.stanford.edu/intelligence-per-watt/
repo_url: https://github.com/HazyResearch/intelligence-per-watt
repo_name: HazyResearch/intelligence-per-watt
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Spectral
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      media: "(prefers-color-scheme)"
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HazyResearch/intelligence-per-watt

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Profiling: user-guide/profiling.md
      - Agents: user-guide/agents.md
      - Datasets: user-guide/datasets.md
      - Analysis & Visualization: user-guide/analysis.md
  - Benchmarking:
      - Overview: benchmarking/overview.md
      - Platform Support: benchmarking/platform-support.md
  - Extending:
      - Extending IPW: extending/index.md
  - Cost:
      - Pricing: cost/pricing.md
