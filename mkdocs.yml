site_name: Intelligence Per Watt
site_description: Benchmarking suite for LLM inference systems measuring accuracy alongside energy consumption
site_url: https://hazyresearch.github.io/intelligence-per-watt/
repo_url: https://github.com/HazyResearch/intelligence-per-watt
repo_name: HazyResearch/intelligence-per-watt

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Prerequisites: getting-started/prerequisites.md
      - Quickstart: getting-started/quickstart.md
  - User Guide:
      - Single-Turn Profiling: user-guide/profiling.md
      - Agentic Profiling: user-guide/agentic-profiling.md
      - Analysis: user-guide/analysis.md
      - Visualization: user-guide/visualization.md
      - Export Formats: user-guide/export-formats.md
  - Agents:
      - Overview: agents/overview.md
      - ReAct: agents/react.md
      - OpenHands: agents/openhands.md
      - Terminus: agents/terminus.md
  - Datasets:
      - Overview: datasets/overview.md
      - Single-Turn: datasets/single-turn.md
      - Agentic: datasets/agentic.md
      - Coding: datasets/coding.md
  - Telemetry:
      - Energy Monitor: telemetry/energy-monitor.md
      - Platform Support: telemetry/platform-support.md
      - Traces: telemetry/traces.md
      - Metrics Reference: telemetry/metrics-reference.md
  - Cost:
      - Pricing: cost/pricing.md
  - Extending:
      - Adding Clients: extending/adding-clients.md
      - Adding Datasets: extending/adding-datasets.md
      - Adding Agents: extending/adding-agents.md
      - Adding Collectors: extending/adding-collectors.md
  - API Reference: api-reference/
