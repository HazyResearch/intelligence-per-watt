[build-system]
requires = ["uv_build>=0.9.2,<0.11.0"]
build-backend = "uv_build"

[project]
name = "ipj"
version = "0.0.1"
description = "ICP research: measurement, orchestration, and reproducible efficiency analysis"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "ipw>=0.1.0",
    "matplotlib>=3.9",
    "click>=8",
    "requests>=2",
    "huggingface-hub>=0.24",
    "numpy>=2.0",
]

[tool.uv.sources]
ipw = { path = "../intelligence-per-watt", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "openai>=1.40", "anthropic>=0.34"]
reproduce = ["pypdf>=5", "Pillow>=10"]
router = ["scikit-learn>=1.9.0"]
orchestrate = ["terminal-bench==0.2.18", "anthropic>=0.34", "openai>=1.40", "docker>=7.0"]
train = [
    "torch>=2.5", "transformers>=4.48,<5", "trl>=0.13,<0.20",
    "peft>=0.14,<0.20", "accelerate>=1.2", "datasets>=3.2",
]

[project.scripts]
ipj = "ipj.cli:main"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network, external services, Docker, or provider credentials",
    "slow: opt-in long-running tests",
    "gpu: requires an accelerator",
    "auto_server: starts an inference server",
    "submodel: uses multiple models",
    "stress: opt-in concurrency stress test",
]
addopts = "-m 'not integration and not slow and not gpu and not stress'"
