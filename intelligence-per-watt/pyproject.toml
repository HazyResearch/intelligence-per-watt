[build-system]
requires = ["uv_build>=0.9.2,<0.11.0"]
build-backend = "uv_build"

[project]
name = "ipw"
version = "0.1.0"
description = "Intelligence Per Watt"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.12.15",
    "rich>=13",
    "click>=8",
    "matplotlib>=3.9",
    "grpcio>=1.62",
    "protobuf>=5",
    "pytest>=8",
    "requests>=2",
    "datasets>=2.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=18",
    "tqdm>=4.66",
    "hf_transfer",
    "python-dotenv",
]

[project.optional-dependencies]
ollama = ["ollama"]
vllm = ["vllm>=0.11.0"]
mlx = ["mlx>=0.20", "mlx-lm>=0.20"]
react = ["agno"]
terminus = ["terminal-bench", "docker"]
openhands = ["openhands-sdk", "openhands-tools"]
agents = ["agno", "terminal-bench", "docker", "openhands-sdk", "openhands-tools"]
deliverables = [
    "fpdf2",
    "mutagen",
    "openpyxl",
    "pdf2image",
    "pdfplumber",
    "Pillow",
    "psd-tools",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "reportlab",
    "scipy",
    "weasyprint",
]
tavily = ["tavily-python"]
flops = ["calflops"]
media-transcription = ["openai-whisper"]
# Browser + pdf extras for react-native + GAIA. After installing
# ipw[browser] run `playwright install chromium` (one-time, ~200MB).
browser = ["playwright>=1.40"]
pdf = ["pdfplumber>=0.10", "pypdf>=4.0"]
# Image understanding (vision via OpenAI) + audio transcription (Whisper).
# Pillow is the only new hard dep; the OpenAI client is already required.
multimodal = ["pillow>=10.0"]
dev = ["ruff>=0.4", "pytest>=8"]
docs = ["mkdocs-material"]
all = [
    "ollama",
    "vllm>=0.11.0",
    "mlx>=0.20",
    "mlx-lm>=0.20",
    "agno",
    "terminal-bench",
    "docker",
    "openhands-sdk",
    "openhands-tools",
    "fpdf2",
    "mutagen",
    "openpyxl",
    "pdf2image",
    "pdfplumber",
    "Pillow",
    "psd-tools",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "reportlab",
    "scipy",
    "tavily-python",
    "calflops",
    "weasyprint",
    "openai-whisper",
    "playwright>=1.40",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "pillow>=10.0",
]
# Benchmark suite — superset including the browser, pdf, and multimodal tools.
bench = [
    "playwright>=1.40",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "pillow>=10.0",
    "agno",
    "openhands-sdk",
    "terminal-bench",
    "docker",
]

[project.scripts]
ipw = "ipw.cli:main"

[tool.uv_build]
package-data = {"ipw" = ["py.typed"], "ipw.telemetry" = ["bin/**"], "ipw.datasets.ipw" = ["data/**"]}

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (may require hardware and running server)",
    "auto_server: marks tests that use the auto-server functionality",
    "submodel: marks tests that use multiple models/submodels",
    "stress: marks the 20-way concurrency stress test (offline, opt-in; excluded from default runs)",
]
# Exclude the opt-in concurrency stress test from default runs. Invoke explicitly with -m stress.
addopts = "-m 'not stress'"
# `timeout` requires pytest-timeout (not currently in dev deps). When installed,
# this caps per-test wall-clock at 10 minutes.
timeout = 600

[tool.ruff]
target-version = "py313"
src = ["src", "src/ipw/tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
