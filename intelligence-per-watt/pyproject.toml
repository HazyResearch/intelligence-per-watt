[build-system]
requires = ["uv_build>=0.9.2,<0.11.0"]
build-backend = "uv_build"

[project]
name = "ipw"
version = "0.1.0"
description = "Intelligence Per Watt"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.12.15",
    "rich>=13",
    "click>=8",
    "matplotlib>=3.9",
    "grpcio>=1.62",
    "protobuf>=5",
    "pytest>=8",
    "requests>=2",
    "datasets>=2.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=18",
    "tqdm>=4.66",
    "hf_transfer",
    "python-dotenv",
]

[project.optional-dependencies]
ollama = ["ollama"]
vllm = ["vllm>=0.11.0"]
react = ["agno"]
terminus = ["terminal-bench", "docker"]
openhands = ["openhands-sdk", "openhands-tools"]
agents = ["agno", "terminal-bench", "docker", "openhands-sdk", "openhands-tools"]
deliverables = [
    "fpdf2",
    "mutagen",
    "openpyxl",
    "pdf2image",
    "pdfplumber",
    "Pillow",
    "psd-tools",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "reportlab",
    "scipy",
    "weasyprint",
]
tavily = ["tavily-python"]
flops = ["calflops"]
media-transcription = ["openai-whisper"]
dev = ["ruff>=0.4", "pytest>=8"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-gen-files", "mkdocs-literate-nav"]
all = [
    "ollama",
    "vllm>=0.11.0",
    "agno",
    "terminal-bench",
    "docker",
    "openhands-sdk",
    "openhands-tools",
    "fpdf2",
    "mutagen",
    "openpyxl",
    "pdf2image",
    "pdfplumber",
    "Pillow",
    "psd-tools",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "reportlab",
    "scipy",
    "tavily-python",
    "calflops",
    "weasyprint",
]

[project.scripts]
ipw = "ipw.cli:main"

[tool.uv_build]
package-data = {"ipw" = ["py.typed"], "ipw.telemetry" = ["bin/**"], "ipw.datasets.ipw" = ["data/**"]}

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (may require hardware and running server)",
    "auto_server: marks tests that use the auto-server functionality",
    "submodel: marks tests that use multiple models/submodels",
]
timeout = 600

[tool.ruff]
target-version = "py313"
src = ["src", "src/ipw/tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
